exclude: '^\.agents/|^node_modules/|^\.next/'
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(cjs|js|jsx|mjs|ts|tsx)$

      - id: npm-type-check
        name: npm type-check
        entry: npm run type-check
        language: system
        pass_filenames: false
        files: \.(cjs|js|jsx|mjs|ts|tsx)$

      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
        files: \.(cjs|js|jsx|mjs|ts|tsx)$

      - id: npm-build
        name: npm build
        entry: npm run build
        language: system
        pass_filenames: false
        files: >-
          \.(cjs|css|js|jsx|mjs|ts|tsx)$|^(package\.json|package-lock\.json|next\.config\..*|tsconfig.*\.json|postcss\.config\..*|eslint\.config\..*)$
